name: Esteira de CI

on:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Black check (print diffs)
        run: black --check --diff .
